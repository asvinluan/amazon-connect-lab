name: Terraform

# Runs on every pull request and on pushes to main.
#
# Split deliberately into two jobs:
#
#   checks  -- needs no AWS credentials at all. Formatting, syntax, lint and
#              static security analysis. Always runs, including on forks.
#
#   plan    -- needs AWS access, so it only runs when an OIDC role has been
#              configured. Skipped cleanly otherwise rather than failing,
#              because a red badge on a public repo caused by a missing
#              secret tells a visitor nothing useful.
#
# There is no apply job. This is a lab: applying is a deliberate local act,
# not something a merge should do to a live contact centre.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write        # required for OIDC; no long-lived AWS keys anywhere
  pull-requests: write   # to post the plan as a comment

defaults:
  run:
    working-directory: terraform

jobs:
  checks:
    name: Format, validate, lint, scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init without a backend
        # -backend=false lets validate run with no AWS credentials and no
        # state. Validation is a syntax and type check, not a plan.
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: '1'
          # Catches public buckets, unencrypted storage, wildcard IAM --
          # the class of mistake that is invisible in review and obvious
          # in an audit.

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: checks
    # Only when the repo has an OIDC role configured. Forks and
    # unconfigured clones skip this instead of failing.
    if: vars.AWS_PLAN_ROLE_ARN != ''

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-2
          # OIDC: GitHub presents a short-lived token and AWS exchanges it
          # for temporary credentials. No access keys in GitHub secrets --
          # a long-lived key stored here is the first thing a security
          # review flags.

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Init
        run: terraform init

      - name: Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan \
            -var="instance_alias=${{ vars.INSTANCE_ALIAS }}" \
            | tee plan.txt
        continue-on-error: true

      - name: Comment the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            // GitHub comments cap at 65536 characters.
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n\n...truncated, see the job log.';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan\n\n\`\`\`terraform\n${plan}\n\`\`\``
            });
            // The reviewer approves a VISIBLE diff. That comment is also the
            // evidence a change record needs.

      - name: Fail if the plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
