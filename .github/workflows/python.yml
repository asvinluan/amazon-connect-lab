name: Python

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and test the Lambda handlers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # matches the Lambda runtime in lambda.tf

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3 ruff

      - name: Lint
        run: ruff check lambda tests

      - name: Format check
        run: ruff format --check lambda tests

      - name: Test
        run: pytest -q
        # conftest.py sets a fake region and fake credentials so no test can
        # reach real AWS, even by accident.
